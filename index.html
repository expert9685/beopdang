<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>극락보전 · 온라인 법당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<style>
  :root{--ink:#f6ead2;--dim:#c9b48f;--gold:#e7c26a;--panel:rgba(30,12,6,.78)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#140803;color:var(--ink);font-family:"Noto Serif KR",serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:fixed;left:0;right:0;top:0;padding:10px 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
  .bar{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center}
  .bar h1{margin:0;font-size:16px;color:var(--gold);letter-spacing:.08em;text-shadow:0 1px 4px #000}
  .bar .stat{font-size:12px;color:var(--dim);text-align:right;line-height:1.45;text-shadow:0 1px 3px #000}
  .bar .stat b{color:var(--ink)}
  .radio{width:100%;max-width:640px;background:var(--panel);border:1px solid rgba(231,194,106,.35);border-radius:14px;padding:10px 14px 9px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .onair{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:#e04a3a;box-shadow:0 0 8px #e04a3a;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.3}}
  .onair b{color:var(--gold);font-size:13px}
  .big{font-size:20px;font-weight:600;line-height:1.35;margin:5px 0 1px;word-break:keep-all;color:#a8977a}
  .big span{transition:color .15s}
  .big span.done{color:#f6ead2}
  .big span.now{color:#ffd77a;text-shadow:0 0 10px rgba(255,200,90,.8)}
  .big.plain{color:var(--ink)}
  .hanja{font-size:13px;color:var(--dim);letter-spacing:.05em;min-height:1.2em}
  .next{font-size:11px;color:#9c8664;margin-top:3px}
  .prog{height:2px;background:rgba(255,255,255,.1);margin-top:6px;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--gold)}
  .hint{font-size:12px;color:var(--ink);background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px;text-shadow:0 1px 2px #000}
  .hint:empty{display:none}
  .soundwarn{display:none;pointer-events:auto;cursor:pointer;font-size:13px;background:#c0392b;color:#fff;padding:7px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .soundwarn.show{display:block}

  #joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(0,0,0,.28);border:1.5px solid rgba(231,194,106,.45);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f3d48a,#a7772a);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .btns{position:fixed;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .btns button{font-family:inherit;font-size:13px;min-width:112px;padding:9px 11px;border-radius:12px;border:1px solid rgba(231,194,106,.5);background:rgba(36,16,8,.82);color:var(--ink);cursor:pointer;backdrop-filter:blur(4px)}
  .btns button.primary{background:linear-gradient(#c79a3c,#8a5f1a);color:#1b0d05;font-weight:700;border-color:#e8c06a}
  .btns button.on{color:var(--gold);border-color:var(--gold)}
  .btns button:active{transform:scale(.97)}

  .modal{position:fixed;inset:0;background:rgba(10,4,2,.86);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  .modal .box{width:100%;max-width:400px;background:#24110a;border:1px solid #7a4a20;border-radius:18px;padding:22px 20px;text-align:center}
  .modal h2{margin:4px 0 6px;color:var(--gold);font-size:20px}
  .modal p{margin:0 0 14px;color:var(--dim);font-size:14px;line-height:1.6}
  .modal input{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid #6a3a1c;background:#170905;color:var(--ink);text-align:center;user-select:text}
  .swatches{display:flex;justify-content:center;gap:10px;margin:14px 0 16px}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.sel{border-color:var(--gold);box-shadow:0 0 0 2px #24110a inset}
  .modal .go{width:100%;font-family:inherit;font-size:16px;padding:13px;border-radius:12px;border:1px solid #e8c06a;background:linear-gradient(#c79a3c,#8a5f1a);color:#1b0d05;font-weight:700;cursor:pointer}
  .modal small{display:block;margin-top:12px;color:#8f7a5c;font-size:12px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:#3a1c0e;border:1px solid var(--gold);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">이 기기에서는 3D 화면을 열 수 없어요.</div>

<div class="top">
  <div class="bar">
    <h1>🪷 극락보전</h1>
    <div class="stat">법당에 <b id="cnt">1</b>분 · <span id="conn">혼자 정진 중</span><br>머문 시간 <b id="sNow">0:00</b> · 오늘 <b id="sToday">0분</b> · 절 <b id="sBows">0배</b> · 탑돌이 <b id="sLaps">0</b>바퀴</div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="soundwarn" id="soundwarn">🔇 소리가 꺼져 있어요 — 여기를 눌러 주세요</div>
</div>

<div id="joy"><div id="knob"></div></div>
<div class="btns">
  <button class="primary" id="bowBtn">🙏 삼배</button>
  <button id="tapBtn" style="display:none">🛕 탑돌이</button>
  <button id="sitBtn">🪷 방석에 앉기</button>
  <button id="soundBtn">🔔 목탁</button>
  <button id="ttsBtn">📿 스님 염불</button>
  <button id="musBtn">🎵 음악</button>
  <button id="subBtn">📜 자막 보기</button>
</div>

<div class="modal" id="welcome">
  <div class="box">
    <div style="font-size:40px">🪷</div>
    <h2>극락보전에 오신 것을 환영합니다</h2>
    <p>법명이나 이름을 적고 법복 색을 고르세요.</p>
    <input id="nameIn" maxlength="10" placeholder="예: 보리심">
    <div class="swatches" id="swatches"></div>
    <button class="go" id="enterBtn">🔔 법당에 들어가기</button>
    <small>왼쪽 원판으로 걷고, 화면을 끌어 시점을 돌려요.<br>방석을 누르면 걸어가서 앉습니다.</small>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const ROBES = ["#7d7d86","#8a5a3b","#34405e","#6f8a4c","#7a3b4f"];
const ROBE_NAMES = ["회색","갈색","감색","연두","자주"];
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("beopdang_v1")) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem("beopdang_v1", JSON.stringify(v)); }catch(e){} }
};
const today = () => new Date().toISOString().slice(0,10);
let saved = store.get();
if (saved.day !== today()) { saved.day = today(); saved.today = 0; }
saved.total = saved.total || 0; saved.bows = saved.bows || 0; saved.today = saved.today || 0;
function persist(){ store.set(saved); }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------------- sutra broadcast data ---------------- */
function rep(h,c,n){ return Array.from({length:n},()=>[h,c]); }
const PROGRAMS = [
  {title:"천수경 · 도입", lines:[
    ["(타종)","",true],
    ["정구업진언","淨口業眞言"],
    ...rep("수리수리 마하수리 수수리 사바하","修里修里 摩訶修里 修修里 娑婆訶",3),
    ["오방내외안위제신진언","五方內外安慰諸神眞言"],
    ...rep("나무 사만다 못다남 옴 도로도로 지미 사바하","南無 三滿多 沒馱喃 唵 度魯度魯 地尾 娑婆訶",3),
    ["개경게","開經偈"],
    ["무상심심미묘법","無上甚深微妙法"],
    ["백천만겁난조우","百千萬劫難遭遇"],
    ["아금문견득수지","我今聞見得受持"],
    ["원해여래진실의","願解如來眞實義"],
    ["개법장진언","開法藏眞言"],
    ...rep("옴 아라남 아라다","唵 阿羅南 阿羅馱",3),
  ]},
  {title:"마하반야바라밀다심경", lines:[
    ["(타종)","",true],
    ["마하반야바라밀다심경","摩訶般若波羅蜜多心經"],
    ["관자재보살 행심반야바라밀다시","觀自在菩薩 行深般若波羅蜜多時"],
    ["조견오온개공 도일체고액","照見五蘊皆空 度一切苦厄"],
    ["사리자 색불이공 공불이색","舍利子 色不異空 空不異色"],
    ["색즉시공 공즉시색","色卽是空 空卽是色"],
    ["수상행식 역부여시","受想行識 亦復如是"],
    ["사리자 시제법공상","舍利子 是諸法空相"],
    ["불생불멸 불구부정 부증불감","不生不滅 不垢不淨 不增不減"],
    ["시고 공중무색 무수상행식","是故 空中無色 無受想行識"],
    ["무안이비설신의 무색성향미촉법","無眼耳鼻舌身意 無色聲香味觸法"],
    ["무안계 내지 무의식계","無眼界 乃至 無意識界"],
    ["무무명 역무무명진","無無明 亦無無明盡"],
    ["내지 무노사 역무노사진","乃至 無老死 亦無老死盡"],
    ["무고집멸도 무지역무득","無苦集滅道 無智亦無得"],
    ["이무소득고 보리살타","以無所得故 菩提薩埵"],
    ["의반야바라밀다고 심무가애","依般若波羅蜜多故 心無罣礙"],
    ["무가애고 무유공포","無罣礙故 無有恐怖"],
    ["원리전도몽상 구경열반","遠離顚倒夢想 究竟涅槃"],
    ["삼세제불 의반야바라밀다고","三世諸佛 依般若波羅蜜多故"],
    ["득아뇩다라삼먁삼보리","得阿耨多羅三藐三菩提"],
    ["고지반야바라밀다","故知般若波羅蜜多"],
    ["시대신주 시대명주","是大神呪 是大明呪"],
    ["시무상주 시무등등주","是無上呪 是無等等呪"],
    ["능제일체고 진실불허","能除一切苦 眞實不虛"],
    ["고설반야바라밀다주 즉설주왈","故說般若波羅蜜多呪 卽說呪曰"],
    ...rep("아제아제 바라아제 바라승아제 모지 사바하","揭諦揭諦 波羅揭諦 波羅僧揭諦 菩提 娑婆訶",3),
  ]},
  {title:"아미타불 정근", lines:[
    ["(타종)","",true],
    ["나무 서방정토 극락세계","南無 西方淨土 極樂世界"],
    ["삼십육만억 일십일만 구천오백 동명동호","三十六萬億 一十一萬 九千五百 同名同號"],
    ["대자대비 아미타불","大慈大悲 阿彌陀佛"],
    ...rep("나무아미타불","南無阿彌陀佛",24),
    ["아미타불재하방 착득심두절막망","阿彌陀佛在何方 着得心頭切莫忘"],
    ["염도염궁무념처 육문상방자금광","念到念窮無念處 六門常放紫金光"],
  ]},
  {title:"관세음보살 정근", lines:[
    ["(타종)","",true],
    ["나무 보문시현 원력홍심","南無 普門示現 願力弘深"],
    ["대자대비 구고구난 관세음보살","大慈大悲 救苦救難 觀世音菩薩"],
    ...rep("관세음보살","觀世音菩薩",24),
    ["멸업장진언","滅業障眞言"],
    ...rep("옴 아로늑계 사바하","唵 阿嚕勒繼 娑婆訶",3),
    ["구족신통력 광수지방편","具足神通力 廣修智方便"],
    ["시방제국토 무찰불현신","十方諸國土 無刹不現身"],
  ]},
];
// timeline
const TL = []; let T = 0;
PROGRAMS.forEach((p,pi)=>{
  p.start = T;
  p.lines.forEach((ln,li)=>{
    const bell = !!ln[2];
    const n = ln[0].replace(/\s/g,"").length;
    const beat = n <= 6 ? 0.6 : 0.52;
    const d = bell ? 7 : 0.5 + n*beat + 0.7;
    TL.push({pi, li, h:ln[0], c:ln[1], bell, t0:T, d, n, beat, syl:[...ln[0].replace(/\s/g,"")]});
    T += d;
  });
  p.dur = T - p.start;
});
const CYCLE = T;

/* ---------------- audio ---------------- */
let ac = null, master = null, wet = null, soundOn = false, ttsOn = false, drone = null;
function makeImpulse(sec){
  const len = Math.floor(ac.sampleRate*sec), buf = ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const d = buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  return buf;
}
function ensureAudio(){
  if (!ac) {
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination);
      const conv = ac.createConvolver(); conv.buffer = makeImpulse(3.2);
      wet = ac.createGain(); wet.gain.value = .45; master.connect(conv).connect(wet).connect(ac.destination);
    }catch(e){ ac = null; }
  }
  if (ac && ac.state !== "running") ac.resume().catch(()=>{});
  unlockMedia();
}
/* 아이폰 무음 스위치·인앱 브라우저에서도 소리가 나도록: 무음 오디오를 함께 재생해 '미디어 재생' 상태로 전환 */
let mediaEl = null;
function silentWavUrl(){
  const sr=8000, n=sr/2, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function unlockMedia(){
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
  try{
    if(!mediaEl){ mediaEl = document.createElement("audio"); mediaEl.src = silentWavUrl(); mediaEl.loop = true; mediaEl.setAttribute("playsinline",""); mediaEl.volume = .01; }
    if(mediaEl.paused){ const p = mediaEl.play(); if(p && p.catch) p.catch(()=>{}); }
  }catch(e){}
}
function audioRunning(){ return !!ac && ac.state === "running"; }
function moktak(accent){
  if(!ac) return; const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(accent?600:540,t); o.frequency.exponentialRampToValueAtTime(320,t+.09);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(accent?.38:.26,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
  o.connect(g).connect(master); o.start(t); o.stop(t+.2);
  const len = Math.floor(ac.sampleRate*.03), buf = ac.createBuffer(1,len,ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const ns = ac.createBufferSource(); ns.buffer=buf;
  const bp = ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1500; bp.Q.value=3;
  const ng = ac.createGain(); ng.gain.value=.18; ns.connect(bp).connect(ng).connect(master); ns.start(t);
}
function bell(base, decay, vol){
  if(!ac) return; const t = ac.currentTime;
  [[1,1],[2.0,.5],[2.76,.35],[5.4,.15],[1.006,.6]].forEach(([r,a])=>{
    const o = ac.createOscillator(), g = ac.createGain();
    o.type="sine"; o.frequency.value = base*r;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*a,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+decay*(r>3?.4:1));
    o.connect(g).connect(master); o.start(t); o.stop(t+decay+.1);
  });
}
const bigBell = () => bell(92, 8, .5);
const smallBell = () => bell(620, 3.2, .18);
/* 대중 염불처럼 낮게 깔리는 '음—' 소리 (남성 저음 모음 합성) */
function setDrone(on){
  if(!ac) return;
  if(!drone){
    const out = ac.createGain(); out.gain.value = 0; out.connect(master);
    const f1 = ac.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=450; f1.Q.value=6;
    const f2 = ac.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=800; f2.Q.value=8;
    const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1200;
    [65.41, 65.6, 98.0].forEach((f,i)=>{
      const o = ac.createOscillator(); o.type="sawtooth"; o.frequency.value=f;
      const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value=4.6+i*.3; vg.gain.value=.6; vib.connect(vg).connect(o.frequency); vib.start();
      const g = ac.createGain(); g.gain.value = i===2?.35:.6;

function poseAvatar(a, st, dt, bowStart, now){
  const sit = st==="sit"||st==="bow";
  const walking = st==="walk";
  a.walkPh = walking ? a.walkPh + dt*8.5 : a.walkPh*.85;
  const sw = walking ? Math.sin(a.walkPh) : 0;
  a.legs.forEach(l=>l.thigh.visible=!sit);
  a.lap.visible = sit; a.skirt.visible = !sit;
  let bend=0;
  if(bowStart && now-bowStart < 7200){ const ph=((now-bowStart)%2400)/2400; bend = Math.pow(Math.sin(ph*Math.PI),1.3); }
  if(sit){
    a.hips.position.y = .36;
    a.torso.rotation.x = bend*1.15;
    a.head.rotation.x = bend*.25;
    a.arms.forEach((ar,i)=>{ const s=i?-1:1;
      if(bend>.05){ ar.sh.rotation.set(-1.2*bend-.3,0,s*.15); ar.el.rotation.set(-.4+.3*bend,0,0); }
      else { ar.sh.rotation.set(-.35,0,s*.18); ar.el.rotation.set(-1.25,s*-.6,0); }
    });
  }else{
    a.hips.position.y = .8 + (walking? Math.abs(Math.cos(a.walkPh))*.025 : Math.sin(now/900)*.004);
    a.torso.rotation.x = walking? .06 : 0;
    a.head.rotation.x = 0;
    a.legs[0].thigh.rotation.set(sw*.55,0,0); a.legs[1].thigh.rotation.set(-sw*.55,0,0);
    a.legs[0].knee.rotation.x = Math.max(0,-Math.sin(a.walkPh))*.8*(walking?1:0);
    a.legs[1].knee.rotation.x = Math.max(0, Math.sin(a.walkPh))*.8*(walking?1:0);
    a.arms[0].sh.rotation.set(-sw*.45,0,.08); a.arms[1].sh.rotation.set(sw*.45,0,-.08);
    a.arms.forEach(ar=>ar.el.rotation.set(walking?-.35:-.12,0,0));
  }
}

const me = { name: saved.name||"", color: Number.isInteger(saved.color)?saved.color:0, x:0, z:15, ry:Math.PI, st:"idle", seat:null, bowAt:0, joinedAt:Date.now() };

const validSeat = x => typeof x==="string" && !!SEAT_BY[x];

function computeOccupants(){
  const list=[];
  peers.filter(p=>p.kind==="viewer" && !p.sameTab).forEach(p=>{ const pr=p.presence||{}; if(validSeat(pr.seat) && (pr.st==="sit"||pr.st==="bow")) list.push({key:p.peer, seat:pr.seat, joinedAt:+pr.joinedAt||0}); });
  if(me.seat) list.push({key:"__me", seat:me.seat, joinedAt:me.joinedAt});
  list.sort((a,b)=>a.joinedAt-b.joinedAt || (a.key<b.key?-1:1));
  const occ={}; list.forEach(o=>{ if(!occ[o.seat]) occ[o.seat]=o; });
  if(me.seat && occ[me.seat].key!=="__me"){ standUp(); toast("다른 분이 먼저 앉으신 자리예요"); }
  return occ;
}
function syncRemotes(){
  const seen=new Set();
  peers.forEach(p=>{
    if(p.kind!=="viewer" || p.sameTab) return;
    const pr=p.presence||{}; if(typeof pr.x!=="number") return;
    seen.add(p.peer);
    const name=(typeof pr.name==="string"&&pr.name?pr.name:"도반").slice(0,10);
    const col=(Number.isInteger(pr.color)&&pr.color>=0&&pr.color<ROBES.length)?pr.color:0;
    let r=remotes.get(p.peer);
    if(r && (r.av.colorIdx!==col || r.av.name!==name)){ disposeAvatar(r.av); r=null; }
    if(!r){ r={av:makeAvatar(col,name,false), x:pr.x, z:pr.z, ry:+pr.ry||0}; r.av.root.position.set(pr.x,0,pr.z); remotes.set(p.peer,r); }
    r.tx=clamp(+pr.x,-38,38); r.tz=clamp(+pr.z,-8,72); r.try=+pr.ry||0; r.st=["idle","walk","sit","bow"].includes(pr.st)?pr.st:"idle";
    const b=+pr.bowAt||0;
    if(lastBow[p.peer]!==undefined && b && b!==lastBow[p.peer]) r.bowStart=performance.now();
    lastBow[p.peer]=b;
  });
  for(const [k,r] of remotes) if(!seen.has(k)){ disposeAvatar(r.av); remotes.delete(k); }
}

function clamp(v,a,b){ return isFinite(v)?Math.max(a,Math.min(b,v)):0; }

function sitAt(id){
  const s=SEAT_BY[id]; if(!s) return;
  if(occupied[id] && occupied[id].key!=="__me"){ toast("이미 다른 분이 앉아 계세요"); return; }

function standUp(){ if(!me.seat) return; me.seat=null; me.st="idle"; me.z += .9; pushPresence(true); updateHint(); }
function nearestFreeSeat(){
  let best=null,bd=1e9; SEATS.forEach(s=>{ if(occupied[s.id]) return; const d=(s.x-me.x)**2+(s.z-me.z)**2; if(d<bd){bd=d;best=s;} }); return best;
}
function goTo(x,z,seat){ if(me.seat) standUp(); stopTap();
  // 구역(법당 안 · 툇마루/기단 · 마당) 사이를 지날 때는 문과 돌계단을 거쳐 가도록 경로를 만든다
  const zone = zz => zz<20 ? 0 : (zz<24.4 ? 1 : 2);
  const path=[]; let zf=zone(me.z), zt=zone(z), cx=me.x;
  while(zf!==zt){
    if(zf===0){ const wx=clamp(cx,-5.5,5.5); path.push({x:wx,z:19.2},{x:wx,z:21.0}); cx=wx; zf=1; }
    else if(zf===1 && zt===0){ const wx=clamp(cx,-5.5,5.5); path.push({x:wx,z:21.0},{x:wx,z:19.2}); cx=wx; zf=0; }
    else if(zf===1 && zt===2){ const wx=clamp(cx,-3,3); path.push({x:wx,z:24.2},{x:wx,z:26.4}); cx=wx; zf=2; }
    else { const wx=clamp(cx,-3,3); path.push({x:wx,z:26.4},{x:wx,z:24.2}); cx=wx; zf=1; }
  }
  path.push({x,z,seat});
  for(let i=path.length-2;i>=0;i--) path[i].next=path[i+1];
  target=path[0]; }
function updateHint(){
  $("hint").textContent = !entered ? "" : me.seat ? "합장하고 독경에 마음을 모아 보세요" : "방석을 누르거나 ‘방석에 앉기’를 눌러 보세요";
  $("sitBtn").textContent = me.seat ? "🚶 일어나기" : "🪷 방석에 앉기";
  SEATS.forEach(s=>{ s.free = !occupied[s.id]; });
}

const joy={x:0,y:0,id:null};

function joyMove(e){ const r=J.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const m=Math.hypot(dx,dy), R=r.width/2-12; if(m>R){dx*=R/m;dy*=R/m;} K.style.transform=`translate(${dx}px,${dy}px)`; joy.x=dx/R; joy.y=-dy/R; }
J.addEventListener("pointerdown",e=>{ joy.id=e.pointerId; J.setPointerCapture(e.pointerId); joyMove(e); ensureAudio(); });

const joyEnd=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; joy.x=joy.y=0; K.style.transform=""; };

const keys={};

addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
let camYaw=0, camPitch=.42, camDist=6.2;
const cv=$("c"); let drag=null;
cv.addEventListener("pointerdown",e=>{ drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true; camYaw -= dx*.006; camPitch = clamp(camPitch + dy*.004, .12, 1.1); });
cv.addEventListener("pointerup",e=>{ if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; if(!d.moved) tap(e.clientX,e.clientY); });
cv.addEventListener("wheel",e=>{ camDist=clamp(camDist+e.deltaY*.005,3,11); e.preventDefault(); },{passive:false});
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function tap(cx,cy){
  if(!entered) return; ensureAudio();
  ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hc = ray.intersectObjects(cushionMeshes,false)[0];
  if(hc && hc.instanceId!==undefined){ const id=SEATS[hc.instanceId].id; if(occupied[id] && occupied[id].key!=="__me"){ toast("이미 다른 분이 앉아 계세요"); return; } const s=SEAT_BY[id]; if(s){ goTo(s.x,s.z+.01,id); return; } }
  const hy = OUTD.yard ? ray.intersectObject(OUTD.yard,false)[0] : null;
  if(hy && hy.point.z>26.1){ goTo(hy.point.x, hy.point.z, null); return; }
  const hf = ray.intersectObject(floor,false)[0];
  if(hf){ goTo(hf.point.x, hf.point.z, null); }
}

  setTimeout(()=>{ bowing=false; if(me.st==="bow") me.st="sit"; pushPresence(true); saved.bows+=3; persist(); updateStats(); toast("삼배를 올렸습니다 🙏"); },7200);
};
let myBowStart=0;
$("tapBtn").onclick=()=>{ ensureAudio(); if(tapRun) stopTap(); else startTap(); updateTapBtn(); };
$("sitBtn").onclick=()=>{ ensureAudio(); if(me.seat){ standUp(); return; } const s=nearestFreeSeat(); if(!s){ toast("빈 방석이 없어요"); return; } goTo(s.x,s.z+.01,s.id); };
$("soundBtn").onclick=()=>{ ensureAudio(); soundOn=!soundOn; $("soundBtn").classList.toggle("on",soundOn); $("soundBtn").textContent=soundOn?"🔔 목탁 켜짐":"🔔 목탁"; if(soundOn) bigBell(); setDrone(soundOn && cur && !cur.bell); };

  if(ttsOn){ buildVoice(); } else voiceRest();
};

/* ---------- sound unlock ---------- */
function unlockAll(){ ensureAudio(); setTimeout(checkSound, 400); }
document.addEventListener("pointerdown", ()=>{ if(entered && !audioRunning()) unlockAll(); }, true);
document.addEventListener("touchend", ()=>{ if(entered && !audioRunning()) unlockAll(); }, true);

setInterval(checkSound, 1500);
if(ac) ac.onstatechange = checkSound;

/* ---------- welcome ---------- */
const swWrap=$("swatches");
ROBES.forEach((c,i)=>{ const d=document.createElement("div"); d.className="sw"+(i===me.color?" sel":""); d.style.background=c; d.title=ROBE_NAMES[i]+" 법복"; d.onclick=()=>{ me.color=i; [...swWrap.children].forEach((x,j)=>x.classList.toggle("sel",j===i)); }; swWrap.appendChild(d); });
$("nameIn").value=me.name;
$("enterBtn").onclick=()=>{
  me.name=($("nameIn").value.trim().slice(0,10))||"도반";

  ensureAudio(); soundOn=true; $("soundBtn").classList.add("on"); $("soundBtn").textContent="🔔 목탁 켜짐"; bigBell(); setDrone(cur && !cur.bell); ttsOn=true; buildVoice(); $("ttsBtn").classList.add("on"); $("ttsBtn").textContent="📿 염불 켜짐"; setMusic(true); $("musBtn").classList.add("on"); $("musBtn").textContent="🎵 음악 켜짐";
  updateHint(); pushPresence(true); setTimeout(checkSound,600);
};

/* ---------- broadcast clock (염불 박자) ---------- */
let cur=null, lastBeat=-1, sylSpans=[], lastSec=0;
function findLine(t){ let lo=0,hi=TL.length-1; while(lo<hi){ const m=(lo+hi+1)>>1; if(TL[m].t0<=t) lo=m; else hi=m-1; } return lo; }
/* 불상 위 천장 쪽 자막판 (선택해서 보기) */
let subOn=false;
const subCv=document.createElement("canvas"); subCv.width=1280; subCv.height=320;
const subTex=new THREE.CanvasTexture(subCv); subTex.encoding=THREE.sRGBEncoding; subTex.anisotropy=4;
const subBoard=new THREE.Group(); subBoard.position.set(0,7.45,-8.2); subBoard.visible=false; scene.add(subBoard);
const subPlane=new THREE.Mesh(new THREE.PlaneGeometry(7.6,1.9),new THREE.MeshBasicMaterial({map:subTex,transparent:true,toneMapped:false,depthWrite:false}));
subPlane.rotation.x=.16; subBoard.add(subPlane);
[-3.2,3.2].forEach(x=>{ const c=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,HALL.h-7.45-.9,4),new THREE.MeshBasicMaterial({color:0x6a5030})); c.position.set(x,(HALL.h-7.45)/2+.45,-.12); subBoard.add(c); });
function drawBanner(ln, beat){
  const g=subCv.getContext("2d"), W=subCv.width, H=subCv.height;
  g.clearRect(0,0,W,H);
  g.fillStyle="rgba(22,9,5,.88)"; g.fillRect(8,8,W-16,H-16);
  g.strokeStyle="#b8904a"; g.lineWidth=5; g.strokeRect(10,10,W-20,H-20); g.lineWidth=2; g.strokeRect(24,24,W-48,H-48);
  g.textAlign="center"; g.textBaseline="middle";
  g.fillStyle="#b89a6a"; g.font="500 30px 'Noto Serif KR', serif"; g.fillText(PROGRAMS[ln.pi].title, W/2, 62);
  if(ln.bell){ g.fillStyle="#e8d2a0"; g.font="600 66px 'Noto Serif KR', serif"; g.fillText("타종 — 마음을 고요히", W/2, H/2+12); }
  else{
    g.font="600 70px 'Noto Serif KR', serif";
    const chars=[...ln.h]; const widths=chars.map(c=>g.measureText(c).width); let total=widths.reduce((a,b)=>a+b,0);
    let scale = Math.min(1, (W-120)/total); g.save(); g.translate(W/2, H/2+8); g.scale(scale,scale);
    let x=-total/2, k=0;
    chars.forEach((c,i)=>{ const w=widths[i]; if(!/\s/.test(c)){ g.fillStyle = k<beat ? "#f4e6c6" : k===beat ? "#ffd56a" : "#b39c74"; if(k===beat){ g.shadowColor="rgba(255,200,90,.9)"; g.shadowBlur=18; } g.fillText(c,x+w/2,0); g.shadowBlur=0; k++; } x+=w; });
    g.restore();
    g.fillStyle="#a88c62"; g.font="400 30px 'Noto Serif KR', serif"; g.fillText(ln.c, W/2, H-62);
  }
  const p=PROGRAMS[ln.pi], t=(Date.now()/1000)%CYCLE;
  g.fillStyle="rgba(184,144,74,.3)"; g.fillRect(40,H-34,W-80,3); g.fillStyle="#d8b064"; g.fillRect(40,H-34,(W-80)*Math.min(1,(t-p.start)/p.dur),3);
  subTex.needsUpdate=true;
}
function showLine(ln,i){ if(subOn) drawBanner(ln,-1); }
$("musBtn").onclick=()=>{ ensureAudio(); if(!ac) return; setMusic(!musicOn); $("musBtn").classList.toggle("on",musicOn); $("musBtn").textContent=musicOn?"🎵 음악 켜짐":"🎵 음악"; };
$("subBtn").onclick=()=>{ subOn=!subOn; subBoard.visible=subOn; $("subBtn").classList.toggle("on",subOn); $("subBtn").textContent=subOn?"📜 자막 끄기":"📜 자막 보기"; if(subOn && cur) drawBanner(cur, lastBeat); };
function broadcast(){
  const now=Date.now()/1000, t=now%CYCLE, i=findLine(t), ln=TL[i];
  if(ln!==cur){
    cur=ln; lastBeat=-1; showLine(ln,i);
    if(entered){
      if(ln.bell){ if(soundOn) bigBell(); voiceRest(); }
      if(soundOn) setDrone(!ln.bell);
    }
  }
  if(!ln.bell){
    const b=Math.floor((t-ln.t0-.5)/ln.beat);
    if(b>=0 && b<ln.n && b!==lastBeat){
      lastBeat=b;
      if(subOn) drawBanner(ln,b);
      MONK.strikeAt=performance.now();
      if(entered){ if(soundOn && ac) moktak(b===0); chantSyllable(ln.syl[b], ln.beat, b, ln.n); }
    }else if(b>=ln.n && lastBeat!==ln.n){ lastBeat=ln.n; if(subOn) drawBanner(ln,ln.n); }
  }

  const sec=Math.floor(now);
  if(sec!==lastSec){ lastSec=sec; if(entered && !document.hidden){ saved.today++; saved.total++; if(sec%10===0) persist(); } updateStats(); }
}
function fmt(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`; }
function updateStats(){
  $("sNow").textContent = entered? fmt((Date.now()-enterAt)/1000) : "0:00";
  const m=Math.floor(saved.today/60); $("sToday").textContent = m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`;
  $("sBows").textContent = saved.bows+"배"; $("sLaps").textContent = saved.laps||0;
}
addEventListener("pagehide",persist);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) persist(); });
setInterval(broadcast,100);

/* ---------- movement & loop ---------- */
const OUTER_PILLARS=[...Array(9)].map((_,i)=>[-13+i*3.25, 22.2]);
function collide(x,z,px,pz){
  x=clamp(x,-38,38); z=clamp(z,-7.0,72);
  // 앞벽: 가운데 열린 문으로만 드나듦
  const crossing = (pz<19.8 && z>=19.8) || (pz>20.2 && z<=20.2) || (z>19.8 && z<20.2);
  if(crossing && Math.abs(x)>6.95){ z = pz<20 ? 19.75 : 20.25; }
  if(z>19.7 && z<20.3){ for(const px2 of [-3.6,0,3.6]){ if(Math.abs(x-px2)<.32) x = px2 + (x<px2?-.32:.32); } }
  if(z<20){
    x=clamp(x,-12.4,12.4);
    for(const [ox,oz,orr] of OBST){ const dx=x-ox, dz=z-oz, d=Math.hypot(dx,dz); if(d<orr){ x=ox+dx/d*orr; z=oz+dz/d*orr; } }
    if(Math.abs(x)>11.5 && z>-7 && z<-1.9){ x=Math.sign(x)*11.5; }
    if(x>-1.55 && x<1.55 && z<-4.15){ const dx=Math.min(x+1.55,1.55-x), dz=-4.15-z; if(dz<dx) z=-4.15; else x = x<0 ? -1.55 : 1.55; }
    for(const [px3,pz3] of PILLARS){ const dx=x-px3, dz=z-pz3, d=Math.hypot(dx,dz); if(d<.85){ x=px3+dx/d*.85; z=pz3+dz/d*.85; } }
  }else if(z<24.5){
    x=clamp(x,-14.6,14.6);
    for(const [px3,pz3] of OUTER_PILLARS){ const dx=x-px3, dz=z-pz3, d=Math.hypot(dx,dz); if(d<.7){ x=px3+dx/d*.7; z=pz3+dz/d*.7; } }
  }else if(z<26.05){
    // 돌계단 (기단 가장자리에서는 떨어지지 않게)
    if(Math.abs(x)>3.8){ if(pz<24.5){ z=24.45; } else x=Math.sign(x)*3.8; }
  }else{
    if(pz<26.05 && Math.abs(x)>3.8) x=Math.sign(x)*3.8;
    for(const [ox,oz,orr] of OUTD.obst){ const dx=x-ox, dz=z-oz, d=Math.hypot(dx,dz)||.001; if(d<orr){ x=ox+dx/d*orr; z=oz+dz/d*orr; } }
    for(const [x0,x1,z0,z1] of OUTD.rects){ if(x>x0&&x<x1&&z>z0&&z<z1){ const m=[x-x0,x1-x,z-z0,z1-z], k=m.indexOf(Math.min(...m)); if(k===0)x=x0; else if(k===1)x=x1; else if(k===2)z=z0; else z=z1; } }
  }
  return [x,z];
}
/* 탑돌이: 석탑을 오른쪽에 두고 시계 방향으로 천천히 돎 */
let tapRun=null;
function startTap(){
  const P=OUTD.pagoda; const a=Math.atan2(me.x-P.x, me.z-P.z);
  tapRun={a, total:0, laps:0};
  if(me.seat) standUp(); target=null;
  toast("석탑을 오른쪽에 두고 탑돌이를 시작합니다 🙏");
}
function stopTap(){ if(!tapRun) return; tapRun=null; me.st="idle"; presDirty=true; updateTapBtn(); }
function updateTapBtn(){
  const outside = me.z>26.2;
  const b=$("tapBtn"); b.style.display = (outside||tapRun) ? "" : "none";
  b.textContent = tapRun ? "✋ 탑돌이 멈추기" : "🛕 탑돌이";
  $("sitBtn").textContent = me.seat ? "🚶 일어나기" : (me.z>20.2 ? "🏯 법당으로" : "🪷 방석에 앉기");
  if(me.z>20.2 && entered) $("hint").textContent = tapRun ? "석탑을 오른쪽에 두고 천천히 돕니다" : (me.z>26.2 ? "‘탑돌이’를 누르면 석탑을 돌아요" : "돌계단을 내려가면 마당이에요");
  else if(entered && !me.seat) $("hint").textContent = "방석을 누르거나 ‘방석에 앉기’를 눌러 보세요";
}
const clock=new THREE.Clock(); const camTarget=new THREE.Vector3(0,1.2,15);
function angLerp(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05), now=performance.now(), tt=now/1000;
  if(entered && player){
    let ix=joy.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
    let iy=joy.y+((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0);
    const mag=Math.min(1,Math.hypot(ix,iy));
    let vx=0,vz=0;
    if(mag>.15){
      if(me.seat) standUp(); target=null; if(tapRun) stopTap();
      const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw), rx=Math.cos(camYaw), rz=-Math.sin(camYaw);
      vx=(fx*iy+rx*ix)/Math.hypot(ix,iy)*mag; vz=(fz*iy+rz*ix)/Math.hypot(ix,iy)*mag;
    }else if(target){
      const dx=target.x-me.x, dz=target.z-me.z, d=Math.hypot(dx,dz);
      if(d<.15){ if(target.next){ target=target.next; } else { if(target.seat) sitAt(target.seat); target=null; } } else { vx=dx/d; vz=dz/d; }
    }
    if(tapRun && !vx && !vz){
      const P=OUTD.pagoda, R=P.r, cx=P.x+Math.sin(tapRun.a)*R, cz=P.z+Math.cos(tapRun.a)*R, d=Math.hypot(cx-me.x,cz-me.z);
      if(d>.5){ vx=(cx-me.x)/d; vz=(cz-me.z)/d; }
      else { const da=1.5/R*dt; tapRun.a-=da; tapRun.total+=da; const nx=P.x+Math.sin(tapRun.a)*R, nz=P.z+Math.cos(tapRun.a)*R; const mvx=nx-me.x, mvz=nz-me.z; me.x=nx; me.z=nz; me.ry=angLerp(me.ry,Math.atan2(mvx,mvz),Math.min(1,dt*8)); me.st="walk"; presDirty=true;
        if(tapRun.total>=Math.PI*2*(tapRun.laps+1)){ tapRun.laps++; saved.laps=(saved.laps||0)+1; persist(); updateStats(); toast(`탑돌이 ${tapRun.laps}바퀴 🙏`); if(soundOn) smallBell(); } }
    }
    if(!me.seat){
      if(vx||vz){ const sp=tapRun?1.8:3.0; [me.x,me.z]=collide(me.x+vx*sp*dt, me.z+vz*sp*dt, me.x, me.z); me.ry=angLerp(me.ry,Math.atan2(vx,vz),Math.min(1,dt*12)); if(me.st!=="walk"){ me.st="walk"; } presDirty=true; }
      else if(me.st==="walk"){ me.st="idle"; presDirty=true; }
    }
    me.y = (me.y===undefined?0:me.y) + (heightAt(me.x,me.z)-(me.y||0))*Math.min(1,dt*10);
    player.root.position.set(me.x,me.y,me.z); player.root.rotation.y=me.ry;
    if(Math.random()<.05) updateTapBtn();
    poseAvatar(player, me.st, dt, me.st==="bow"?myBowStart:0, now);
    camTarget.lerp(new THREE.Vector3(me.x,(me.y||0)+(me.seat?1.0:1.3),me.z), Math.min(1,dt*6));
  }
  presTimer+=dt; if(presTimer>.1){ presTimer=0; sendPres(); }
  for(const r of remotes.values()){
    const k=Math.min(1,dt*8); r.x+=(r.tx-r.x)*k; r.z+=(r.tz-r.z)*k; r.ry=angLerp(r.ry,r.try,k);
    r.av.root.position.set(r.x,heightAt(r.x,r.z),r.z); r.av.root.rotation.y=r.ry;
    poseAvatar(r.av, r.st, dt, r.bowStart||0, now);
  }
  // camera
  const cp=Math.cos(camPitch);
  camera.position.set(camTarget.x+Math.sin(camYaw)*camDist*cp, camTarget.y+Math.sin(camPitch)*camDist, camTarget.z+Math.cos(camYaw)*camDist*cp);
  const outCam = me.z>20.6 || camTarget.z>20.6;
  if(!outCam){ camera.position.x=clamp(camera.position.x,-12.6,12.6); camera.position.z=clamp(camera.position.z,-8,19.7); camera.position.y=Math.min(camera.position.y,5.7); }
  else { camera.position.x=clamp(camera.position.x,-38,38); camera.position.z=clamp(camera.position.z,20.4,74); if(camera.position.z<24.6) camera.position.y=Math.min(camera.position.y,7.2); camera.position.y=Math.max(camera.position.y,heightAt(camera.position.x,camera.position.z)+.5); }
  // 바깥에 나가면 햇빛 아래처럼 밝게, 안개도 걷힘
  const outK = clamp((camera.position.z-19)/6,0,1);
  hemi.intensity=.16+1.1*outK; hemi.color.setHex(outK>.5?0xdfe8ff:0x6a5a80); hemi.groundColor.setHex(outK>.5?0x8a7a5a:0x120604); amb.intensity=.2+.25*outK;
  scene.fog.near=14+80*outK; scene.fog.far=42+300*outK;
  camera.lookAt(camTarget);
  // ambience
  flames.forEach(([f,l],i)=>{ const s=1+Math.sin(tt*23+i*3)*.08+Math.sin(tt*37+i)*.05; f.scale.set(1,s,1); if(l) l.intensity=.75+Math.sin(tt*17+i*2)*.12; });
  updateLanterns(tt);
  smokes.forEach(s=>{ const ph=(tt*.12+s.userData.o)%1; s.position.set(MONK.smokeOrigin.x+Math.sin(ph*9+s.userData.o*6)*.12*ph, MONK.smokeOrigin.y+ph*2.4, MONK.smokeOrigin.z); s.scale.setScalar(.15+ph*.6); s.material.opacity=Math.sin(ph*Math.PI)*.35; });
  const pulse=.5+.5*Math.sin(tt*2.5);
  if(target && target.seat && SEAT_BY[target.seat]){ const s=SEAT_BY[target.seat]; targetRing.position.set(s.x,.02,s.z); targetRing.material.opacity=.2+pulse*.4; } else targetRing.material.opacity=0;
  [amita,gwan].forEach((g,i)=>{ g.userData.glow.material.opacity=.11+.05*Math.sin(tt*.5+i*1.7); });
  shafts.forEach((m,i)=>{ m.material.opacity=.022+.01*Math.sin(tt*.4+i*2); });
  for(let i=0;i<moteN;i++){ const [x,y,z,ph]=moteSeed[i]; const yy=(y+tt*.18)%6; motePos[i*3]=x+Math.sin(tt*.3+ph)*.3; motePos[i*3+1]=1.2+yy; motePos[i*3+2]=z+Math.cos(tt*.25+ph)*.3; }
  moteGeo.attributes.position.needsUpdate=true;
  broadcast(); musicTick();
  animateMonk(now, !!(cur && !cur.bell));
  renderer.render(scene,camera);
}
loop();

/* ---------- room ---------- */
(async()=>{
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const r=await window.claude.use("room"); if(!r) return;
    room=r;
    room.onPeers(ch=>{ peers=ch.peers; syncRemotes(); occupied=computeOccupants(); updateHint(); updatePeopleUI(); },
      ()=>{ room=null; peers=[]; for(const [k,v] of remotes) disposeAvatar(v.av); remotes.clear(); $("conn").textContent="혼자 정진 중"; updatePeopleUI(); });
    room.onConnection(ok=>{ $("conn").textContent= ok?"함께 정진 중":"연결 중…"; },()=>{});
    if(entered) pushPresence(true);
  }catch(e){}
})();
})();
